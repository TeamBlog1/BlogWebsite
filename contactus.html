<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TechCrunch</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        /* Reset & basic */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            line-height: 1.6;
            background-color: #f9f9f9;
            color: #333;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header */
        .header {
            background-color: #0b0b0b;
            color: #fff;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar.container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        /* Menu */
        .menu ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .list-link {
            color: #fff;
            padding: 5px 10px;
            transition: background 0.3s, color 0.3s;
        }

            .list-link:hover,
            .list-link.current {
                background-color: #fff;
                color: #0b0b0b;
                border-radius: 4px;
            }

        /* Hamburger icon */
        .hamburger {
            display: none;
            font-size: 28px;
            cursor: pointer;
        }

        /* Main section */
        main {
            padding: 50px 20px;
            display: flex;
            justify-content: center;
        }

            main section {
                background-color: #fff;
                padding: 40px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                width: 100%;
                max-width: 600px;
                transition: padding 0.3s;
            }

            main h2 {
                margin-bottom: 10px;
                font-size: 28px;
                text-align: center;
            }

            main p {
                margin-bottom: 30px;
                text-align: center;
                color: #666;
            }

        form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        form input,
        form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

            form input:focus,
            form textarea:focus {
                outline: none;
                border-color: #0b0b0b;
            }

        form button {
            display: block;
            width: 100%;
            background-color: #0b0b0b;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

            form button:hover {
                background-color: #333;
            }

        /* Footer */
        .footer {
            background-color: #0b0b0b;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .menu ul {
                flex-direction: column;
                gap: 10px;
                display: none; /* hide menu initially */
                width: 100%;
            }

                .menu ul.show {
                    display: flex;
                }

            .hamburger {
                display: block;
                color: #fff;
            }

            main section {
                padding: 30px 20px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 20px;
            }

            main h2 {
                font-size: 24px;
            }

            form button {
                font-size: 16px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <header class="header" id="header">
        <nav class="navbar container">
            <a href="blog.html"><h2 class="logo">TechCrunch</h2></a>

            <div class="hamburger" id="hamburger">
                <i class="ri-menu-line"></i>
            </div>

            <div class="menu" id="menu">
                <ul class="list" id="nav-list">
                    <li class="list-item"><a href="blog.html" class="list-link">Home</a></li>
                    <li class="list-item"><a href="#" class="list-link">Categories</a></li>
                    <li class="list-item"><a href="#" class="list-link">Reviews</a></li>
                    <li class="list-item"><a href="#" class="list-link">News</a></li>
                    <li class="list-item"><a href="#" class="list-link">Membership</a></li>
                    <li class="list-item"><a href="contact.html" class="list-link current">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>
            <p>You can send us a message for any questions or suggestions.</p>

            <form>
                <label>Name</label>
                <input type="text" placeholder="Write your name" required>

                <label>Email</label>
                <input type="email" placeholder="Write your email" required>

                <label>Message</label>
                <textarea rows="5" placeholder="Write your message" required></textarea>

                <button type="submit">Send message</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>© 2024 TechCrunch. All rights reserved.</p>
    </footer>

    <script>
        // Hamburger menu toggle
        const hamburger = document.getElementById('hamburger');
        const navList = document.getElementById('nav-list');

        hamburger.addEventListener('click', () => {
            navList.classList.toggle('show');
        });
    </script>

</body>
</html>
