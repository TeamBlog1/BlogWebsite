     <main>
         <section>
            <h2>Contact Us</h2>
             <p>You can send us a message for any questions or suggestions.</p>

             <form action="#" method="post"> 
                 <label for="name">Name:</label>
                 <input type="text" id="name" name="name" placeholder="Write your name" required>

                 <label for="email">Email:</label>
                 <input type="email" id="email" name="email" placeholder="Write your email" required>

                 <label for="message">Message:</label>
                 <textarea id="message" name="message" placeholder="Write your message"rows="5" required></textarea>

                 <button type="submit">Send message</button>
             </form>
         </section>
       </main>
